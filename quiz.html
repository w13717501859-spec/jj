const baseSetup=setup;
setup=function(){baseSetup();const panel=document.createElement('div');panel.innerHTML='<hr class="divider"><h2>系统学习</h2><div class="actions"><button id="seriesNav">成套单词专项</button><button id="phrasesNav">常用短语、句式</button><button id="dataNav">词库备份与同步</button></div><p class="form-note">2026.09.18 · 专项内容独立整理，不改变你的新增词汇状态。</p>';$('#app').append(panel);$('#seriesNav').onclick=()=>studyMenu(false);$('#phrasesNav').onclick=()=>studyMenu(true);$('#dataNav').onclick=dataPanel};
function studyMenu(phrases){const groups=phrases?PHRASES:SERIES;$('#app').innerHTML='<h2>'+ (phrases?'常用短语、句式':'成套单词专项')+'</h2><p>先按顺序学习，再随机自测；每条都可点播日语。</p><div class="word-grid">'+Object.entries(groups).map(([name,list],i)=>'<button data-group="'+i+'">'+esc(name)+' · '+list.length+'条</button>').join('')+'</div>'+(phrases?'<button id="patterns">常用句式 · '+PATTERNS.length+'组</button>':'<p class="form-note">四月读 shigatsu、七月读 shichigatsu、九月读 kugatsu；数字读法会随月份、日期及量词变化。颜色表为名词形式，如「あか」修饰名词时常用「あかい」。</p>')+'<div class="actions"><button id="home">返回首页</button></div>';$('#home').onclick=setup;$('#app').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>studyList(Object.keys(groups)[+b.dataset.group],groups[Object.keys(groups)[+b.dataset.group]],phrases));if(phrases)$('#patterns').onclick=patternList}
function studyList(title,list,phrases){$('#app').innerHTML='<h2>'+esc(title)+'</h2><div class="actions"><button id="testCN">中文 → 日语自测</button><button id="testJP">日语 → 中文自测</button><button id="back">返回分类</button></div><div class="word-grid">'+list.map((w,i)=>'<article class="word-card"><div class="word-cn">'+esc(w[0])+'</div><div>'+esc(w[1])+'</div><div class="word-jp">'+esc(w[2])+'</div><button data-audio="'+i+'">🔊 发音</button></article>').join('')+'</div>';$('#back').onclick=()=>studyMenu(phrases);$('#testCN').onclick=()=>studyTest(list,false,()=>studyList(title,list,phrases));$('#testJP').onclick=()=>studyTest(list,true,()=>studyList(title,list,phrases));$('#app').querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>speakJapanese(speechText(list[+b.dataset.audio])))}
function studyTest(list,jpcn,back){let queue=shuffle(list),i=0,correct=0;function draw(){if(i===queue.length){$('#app').innerHTML='<h2>专项完成</h2><p>答对 '+correct+' / '+queue.length+' 题</p><button id="back">返回学习列表</button>';$('#back').onclick=back;return}let w=queue[i];$('#app').innerHTML='<p>专项 '+(i+1)+' / '+queue.length+'</p><div class="prompt">'+esc(jpcn?w[2]:w[0])+'</div><div id="studyAnswer" class="hidden"><p>'+esc(w[0])+'</p><p>'+esc(w[1])+'</p><p>'+esc(w[2])+'</p></div><div class="actions">'+(jpcn?'<button id="studySpeak">🔊 再听一次</button>':'')+'<button id="studyShow">显示答案</button><button id="studyBack">退出专项</button></div><div id="studyGrade" class="actions hidden"><button id="studyYes">我答对了</button><button id="studyNo">再练一练</button></div>';$('#studyBack').onclick=back;$('#studyShow').onclick=()=>{$('#studyAnswer').classList.remove('hidden');$('#studyGrade').classList.remove('hidden');$('#studyShow').disabled=true};$('#studyYes').onclick=()=>{correct++;i++;draw()};$('#studyNo').onclick=()=>{i++;draw()};if(jpcn){$('#studySpeak').onclick=()=>speakJapanese(speechText(w));speakJapanese(speechText(w))}}draw()}
function patternList(){const practice=PATTERNS.map(p=>[p[5],p[4],p[3],'句式']);$('#app').innerHTML='<h2>常用句式</h2><p>先看结构和用法，再用完整例句练习。</p><div class="actions"><button id="patternTest">例句专项自测</button><button id="patternBack">返回分类</button></div>'+PATTERNS.map((p,i)=>'<article class="word-card" style="margin:12px 0"><h3>'+esc(p[0])+'</h3><b>'+esc(p[1])+'</b><p>'+esc(p[2])+'</p><p>'+esc(p[3])+'</p><p>'+esc(p[4])+'</p><p>'+esc(p[5])+'</p><button data-pattern="'+i+'">🔊 听例句</button></article>').join('');$('#patternBack').onclick=()=>studyMenu(true);$('#patternTest').onclick=()=>studyTest(practice,false,patternList);$('#app').querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>speakJapanese(PATTERNS[+b.dataset.pattern][3]))}
function exportLearning(){const data={format:'jp-vocab-backup',version:1,exportedAt:new Date().toISOString(),custom:customWords(),learned:[...learnedCustomKeys()],wrong:wrongWords()};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='日语学习备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function validateBackup(data){if(!data||data.format!=='jp-vocab-backup'||data.version!==1)throw Error('请选择本网页导出的学习备份');for(const field of ['custom','wrong']){if(!Array.isArray(data[field])||data[field].length>20000||data[field].some(w=>!Array.isArray(w)||w.length!==4||w.some(v=>typeof v!=='string'||v.length>2000)||!w[0].trim()||!w[1].trim()))throw Error('备份词汇格式不正确')}if(!Array.isArray(data.learned)||data.learned.some(k=>typeof k!=='string'||k.length>4001))throw Error('已学会记录格式不正确');return data}
function importLearning(data){validateBackup(data);const merge=(old,fresh)=>{const map=new Map(old.map(w=>[wordKey(w),w]));fresh.forEach(w=>map.set(wordKey(w),w));return [...map.values()]};const next={};next[CUSTOM_KEY]=JSON.stringify(merge(customWords(),data.custom));next[WRONG_KEY]=JSON.stringify(merge(wrongWords(),data.wrong));next[LEARNED_CUSTOM_KEY]=JSON.stringify([...new Set([...learnedCustomKeys(),...data.learned])]);const previous=Object.fromEntries(Object.keys(next).map(k=>[k,localStorage.getItem(k)]));try{for(const k of Object.keys(next))localStorage.setItem(k,next[k])}catch(e){for(const k of Object.keys(previous)){try{if(previous[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,previous[k])}catch{}}throw Error('保存失败，请先导出备份并检查浏览器存储空间')}return data.custom.length}
function dataPanel(){$('#app').innerHTML='<h2>词库备份与同步</h2><p>电脑和手机各自保存学习数据，不会自动互通。先在电脑导出，再将备份文件传到手机并在公开网页导入。</p><button id="exportData">导出学习数据</button><p>备份包括全部新增词、已学会记录和错题。导入会合并数据，不删除本机其他词汇；相同中文和罗马音以备份中的内容为准。</p><label>选择学习备份（JSON）<input id="importData" type="file" accept=".json,application/json"></label><p id="dataStatus" role="status"></p><button id="dataBack">返回首页</button>';$('#exportData').onclick=exportLearning;$('#dataBack').onclick=setup;$('#importData').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('备份文件过大');const d=validateBackup(JSON.parse(await f.text()));if(!confirm('将合并 '+d.custom.length+' 个词及学习记录，是否继续？'))return;importLearning(d);$('#dataStatus').textContent='导入成功，共处理 '+d.custom.length+' 个新增词。'}catch(err){$('#dataStatus').textContent=err.message}}}
setup();

</script></body></html>
